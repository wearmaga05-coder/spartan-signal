<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08111b">
<title>Spartan Signal</title>

<style>
:root {
    --bg: #08111b;
    --panel: #101b27;
    --panel2: #0c1621;
    --line: #203243;
    --text: #eaf2fb;
    --muted: #8295a9;
    --cyan: #47d7f4;
    --green: #31d69a;
    --red: #ff6577;
    --gold: #d6b56d;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
}

.app {
    max-width: 520px;
    margin: auto;
    padding: 14px 14px 30px;
}

.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 4px 0 16px;
}

.brand {
    font-weight: 900;
    letter-spacing: 2px;
    font-size: 18px;
}

.brand span {
    color: var(--cyan);
}

.topright {
    display: flex;
    gap: 8px;
    align-items: center;
}

.lang,
.gear {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    border-radius: 10px;
    padding: 8px 10px;
    font-weight: 700;
}

.lang.active {
    color: var(--cyan);
    border-color: var(--cyan);
}

.gear {
    font-size: 18px;
    padding: 6px 10px;
}

.panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
}

.settings {
    display: none;
}

.settings.open {
    display: block;
}

.field {
    margin-bottom: 12px;
}

.field label {
    display: block;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1px;
    font-weight: 800;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    border: 1px solid var(--line);
    background: #07111b;
    color: var(--text);
    border-radius: 10px;
    padding: 12px;
    font: inherit;
    outline: none;
}

input:focus,
select:focus {
    border-color: var(--cyan);
}

.btn {
    border: 0;
    border-radius: 12px;
    background: var(--cyan);
    color: #07111b;
    font-weight: 900;
    padding: 13px;
    width: 100%;
    font: inherit;
    cursor: pointer;
}

.btn:disabled {
    opacity: .55;
}

.statusrow {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 12px;
    margin: 2px 0 12px;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 10px #31d69a66;
}

.dot.off {
    background: var(--red);
    box-shadow: none;
}

.assetrow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 800;
    margin-bottom: 8px;
}

.asset {
    font-size: 13px;
}

.live {
    font-size: 10px;
    color: var(--green);
    letter-spacing: 1px;
}

.chartwrap {
    height: 245px;
    position: relative;
    background: var(--panel2);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #172635;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.tfs {
    display: flex;
    gap: 6px;
    margin-top: 12px;
}

.tf {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    padding: 8px 0;
    font-weight: 800;
    font-size: 12px;
}

.tf.active {
    background: #142c3b;
    color: var(--cyan);
    border-color: #286078;
}

.mode {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1px;
    font-weight: 800;
    margin: 14px 0 8px;
}

.modeval {
    color: var(--text);
    font-size: 12px;
    letter-spacing: 0;
}

.signal {
    display: none;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    background: var(--panel);
    margin-top: 12px;
}

.signal.show {
    display: block;
}

.sighead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1.2px;
    font-weight: 900;
    margin-bottom: 14px;
}

.engine {
    color: var(--cyan);
    font-size: 10px;
}

.direction {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 26px;
    font-weight: 950;
    margin-bottom: 10px;
}

.arrow {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    font-size: 25px;
}

.rise .arrow {
    background: #123c31;
    color: var(--green);
}

.fall .arrow {
    background: #40202a;
    color: var(--red);
}

.neutral .arrow {
    background: #253341;
    color: var(--muted);
}

.prob {
    font-size: 15px;
    font-weight: 800;
    margin: 8px 0;
}

.prob strong {
    font-size: 24px;
    color: var(--cyan);
}

.meta {
    display: flex;
    gap: 8px;
    margin: 12px 0;
}

.pill {
    background: #0a1420;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 10px;
    flex: 1;
    font-size: 12px;
    color: var(--muted);
}

.pill b {
    display: block;
    color: var(--text);
    font-size: 14px;
    margin-top: 3px;
}

.reason {
    border-top: 1px solid var(--line);
    padding-top: 12px;
    color: #c4d2df;
    font-size: 13px;
}

.disclaimer {
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    margin: 14px 4px 0;
}

.error {
    color: var(--red);
    font-size: 12px;
    margin-top: 8px;
    white-space: pre-wrap;
}

.foot {
    color: var(--muted);
    font-size: 10px;
    text-align: center;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="app">

<header class="top">
    <div class="brand">SPARTAN <span>SIGNAL</span></div>

    <div class="topright">
        <button class="lang active" id="ruBtn">RU</button>
        <button class="lang" id="enBtn">EN</button>
        <button class="gear" id="gearBtn" aria-label="Настройки">⚙</button>
    </div>
</header>

<!-- SETTINGS -->

<section class="panel settings" id="settingsPanel">

    <div class="field">
        <label>AI PROVIDER</label>

        <select id="provider">
            <option value="openai">OpenAI</option>
            <option value="deepseek">DeepSeek</option>
            <option value="gemini">Google Gemini</option>
        </select>
    </div>

    <div class="field">
        <label>AI API KEY</label>

        <input
            id="aiKey"
            type="password"
            placeholder="Вставьте API-ключ"
            autocomplete="off"
        >
    </div>

    <div class="field">
        <label>DERIV TOKEN ИЛИ APP ID</label>

        <input
            id="derivKey"
            type="password"
            placeholder="Token (необязательно) или числовой App ID"
            autocomplete="off"
        >
    </div>

    <button class="btn" id="saveBtn">
        Сохранить и подключиться
    </button>

    <div class="foot">
        Ключи сохраняются в localStorage этого браузера.
    </div>

</section>

<!-- CONNECTION STATUS -->

<div class="statusrow">
    <span class="dot off" id="statusDot"></span>
    <span id="statusText">Подключение к Deriv…</span>
</div>

<!-- CHART -->

<section class="panel">

    <div class="assetrow">
        <span class="asset">Volatility 100 (1s) Index</span>
        <span class="live">● LIVE</span>
    </div>

    <div class="chartwrap">
        <canvas id="chart"></canvas>
    </div>

    <div class="tfs" id="timeframes">

        <button class="tf active" data-tf="1m">1m</button>
        <button class="tf" data-tf="5m">5m</button>
        <button class="tf" data-tf="15m">15m</button>
        <button class="tf" data-tf="30m">30m</button>
        <button class="tf" data-tf="1h">1h</button>

    </div>

    <div class="mode">
        <span id="modeLabel">РЕЖИМ</span>
        <span class="modeval">Rise / Fall</span>
    </div>

</section>

<!-- ANALYZE BUTTON -->

<button class="btn" id="analyzeBtn">
    АНАЛИЗ ИИ
</button>

<div class="error" id="errorBox"></div>

<!-- SIGNAL -->

<section class="signal" id="signalBox">

    <div class="sighead">
        <span id="signalTitle">СИГНАЛ</span>
        <span class="engine" id="engineLabel">AI ENGINE</span>
    </div>

    <div class="direction" id="direction">
        <span class="arrow" id="arrow">↗</span>
        <span id="directionText">Rise</span>
    </div>

    <div class="prob" id="probability">
        Оценка модели: <strong>—</strong>
    </div>

    <div class="meta">

        <div class="pill" id="candlePill">
            📊 Свечей
            <b>—</b>
        </div>

        <div class="pill" id="timePill">
            🕒 Таймфрейм
            <b>—</b>
        </div>

    </div>

    <div class="reason" id="reason"></div>

</section>

<p class="disclaimer" id="disclaimer">
    AI-оценка не является гарантией направления цены или финансовым советом.
</p>

</div>

<script>

(() => {

'use strict';

const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();

    try {
        tg.setHeaderColor('#08111b');
        tg.setBackgroundColor('#08111b');
    } catch (_) {}
}

const $ = id => document.getElementById(id);

const SYMBOL = '1HZ100V';

const tfMap = {
    '1m': 60,
    '5m': 300,
    '15m': 900,
    '30m': 1800,
    '1h': 3600
};

let tf = '1m';
let ws = null;
let reconnectTimer = null;
let candles = [];
let liveQuote = null;
let busy = false;
let lang = 'ru';
let socketGeneration = 0;

const translations = {

    ru: {
        connecting: 'Подключение к Deriv…',
        online: 'Deriv подключен',
        offline: 'Нет соединения',
        mode: 'РЕЖИМ',
        analyze: 'АНАЛИЗ ИИ',
        working: 'ИИ анализирует…',
        signal: 'СИГНАЛ',
        prob: 'Оценка модели:',
        candles: 'свечей',
        time: 'Таймфрейм',
        disclaimer: 'AI-оценка не является гарантией направления цены или финансовым советом.',
        rise: 'Rise',
        fall: 'Fall',
        neutral: 'Нет сигнала',
        save: 'Сохранить и подключиться'
    },

    en: {
        connecting: 'Connecting to Deriv…',
        online: 'Deriv connected',
        offline: 'Connection lost',
        mode: 'MODE',
        analyze: 'AI ANALYSIS',
        working: 'AI analyzing…',
        signal: 'SIGNAL',
        prob: 'Model estimate:',
        candles: 'candles',
        time: 'Timeframe',
        disclaimer: 'AI estimate is not a guarantee of price direction or financial advice.',
        rise: 'Rise',
        fall: 'Fall',
        neutral: 'No signal',
        save: 'Save & connect'
    }

};

function tr(key) {
    return translations[lang][key] || key;
}

function setStatus(ok, text) {
    $('statusDot').classList.toggle('off', !ok);
    $('statusText').textContent = text;
}

function getSaved(id) {
    try {
        return localStorage.getItem(id) || '';
    } catch (_) {
        return '';
    }
}

function save(id, val) {
    try {
        localStorage.setItem(id, val);
    } catch (_) {}
}

/* LOAD SETTINGS */

$('provider').value =
    getSaved('spartan_ai_provider') || 'deepseek';

$('aiKey').value =
    getSaved('spartan_ai_key');

$('derivKey').value =
    getSaved('spartan_deriv_key');

/* SETTINGS PANEL */

$('gearBtn').onclick = () => {

    $('settingsPanel').classList.toggle('open');

    $('gearBtn').classList.toggle('active');

};

$('saveBtn').onclick = () => {

    save('spartan_ai_provider', $('provider').value);

    save('spartan_ai_key', $('aiKey').value.trim());

    save('spartan_deriv_key', $('derivKey').value.trim());

    $('settingsPanel').classList.remove('open');

    $('gearBtn').classList.remove('active');

    connectDeriv();

};

/* LANGUAGE */

$('ruBtn').onclick = () => setLang('ru');

$('enBtn').onclick = () => setLang('en');

function setLang(l) {

    lang = l;

    $('ruBtn').classList.toggle('active', l === 'ru');

    $('enBtn').classList.toggle('active', l === 'en');

    $('modeLabel').textContent = tr('mode');

    $('analyzeBtn').textContent = tr('analyze');

    $('signalTitle').textContent = tr('signal');

    $('disclaimer').textContent = tr('disclaimer');

    $('statusText').textContent =
        ws?.readyState === 1 ? tr('online') : tr('connecting');

}

/* TIMEFRAME BUTTONS */

document.querySelectorAll('.tf').forEach(button => {

    button.onclick = () => {

        document.querySelectorAll('.tf')
            .forEach(b => b.classList.remove('active'));

        button.classList.add('active');

        tf = button.dataset.tf;

        loadCandles();

    };

});

/* DERIV CONNECTION */

function connectDeriv() {

    clearTimeout(reconnectTimer);

    socketGeneration++;

    const generation = socketGeneration;

    if (ws) {

        try {
            ws.onclose = null;
            ws.close();
        } catch (_) {}

    }

    candles = [];
    liveQuote = null;

    drawChart();

    const key = getSaved('spartan_deriv_key').trim();

    const isToken =
        key.length > 0 && !(/^\d+$/.test(key));

    const appId =
        key && /^\d+$/.test(key) ? key : '1089';

    setStatus(false, tr('connecting'));

    try {

        ws = new WebSocket(
            `wss://ws.derivws.com/websockets/v3?app_id=${encodeURIComponent(appId)}`
        );

    } catch (e) {

        scheduleReconnect(generation);

        return;

    }

    ws.onopen = () => {

        if (generation !== socketGeneration) return;

        if (isToken) {

            ws.send(JSON.stringify({
                authorize: key
            }));

        } else {

            loadCandles();

        }

    };

    ws.onmessage = event => {

        if (generation !== socketGeneration) return;

        let d;

        try {
            d = JSON.parse(event.data);
        } catch (_) {
            return;
        }

        if (d.error) {

            setStatus(false, `Deriv: ${d.error.message || d.error.code}`);

            $('errorBox').textContent =
                d.error.message || d.error.code;

            return;

        }

        if (d.msg_type === 'authorize') {

            loadCandles();

            return;

        }

        /* HISTORICAL CANDLES */

        if (d.msg_type === 'candles' && d.candles) {

            candles = d.candles.map(c => ({
                epoch: Number(c.epoch),
                open: Number(c.open),
                high: Number(c.high),
                low: Number(c.low),
                close: Number(c.close)
            }));

            setStatus(true, tr('online'));

            drawChart();

            ws.send(JSON.stringify({
                ticks: SYMBOL,
                subscribe: 1
            }));

        }

        /* LIVE TICKS */

        if (d.msg_type === 'tick' && d.tick) {

            liveQuote = Number(d.tick.quote);

            const epoch = Number(d.tick.epoch);

            if (candles.length) {

                const bucket =
                    Math.floor(epoch / tfMap[tf]) * tfMap[tf];

                const last = candles[candles.length - 1];

                if (last.epoch === bucket) {

                    last.close = liveQuote;

                    last.high = Math.max(last.high, liveQuote);

                    last.low = Math.min(last.low, liveQuote);

                } else if (bucket > last.epoch) {

                    candles.push({
                        epoch: bucket,
                        open: last.close,
                        high: liveQuote,
                        low: liveQuote,
                        close: liveQuote
                    });

                    if (candles.length > 80) {
                        candles.shift();
                    }

                }

            }

            setStatus(true, tr('online'));

            drawChart();

        }

    };

    ws.onerror = () => {

        setStatus(false, tr('offline'));

    };

    ws.onclose = () => {

        if (generation !== socketGeneration) return;

        setStatus(false, tr('connecting'));

        scheduleReconnect(generation);

    };

}

function scheduleReconnect(generation) {

    if (generation !== socketGeneration) return;

    reconnectTimer = setTimeout(() => {

        if (generation === socketGeneration) {
            connectDeriv();
        }

    }, 2500);

}

function loadCandles() {

    if (!ws || ws.readyState !== 1) return;

    ws.send(JSON.stringify({

        ticks_history: SYMBOL,

        adjust_start_time: 1,

        count: 80,

        end: 'latest',

        style: 'candles',

        granularity: tfMap[tf]

    }));

}

/* CHART */

const canvas = $('chart');

const ctx = canvas.getContext('2d');

function drawChart() {

    const rect = canvas.getBoundingClientRect();

    if (!rect.width || !rect.height) return;

    const dpr = window.devicePixelRatio || 1;

    canvas.width = Math.round(rect.width * dpr);

    canvas.height = Math.round(rect.height * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const w = rect.width;

    const h = rect.height;

    ctx.clearRect(0, 0, w, h);

    if (candles.length < 2) {

        ctx.fillStyle = '#8295a9';

        ctx.font = '12px sans-serif';

        ctx.fillText('Ожидание котировок…', 12, 24);

        return;

    }

    const visible = candles.slice(-45);

    const min = Math.min(...visible.map(c => c.low));

    const max = Math.max(...visible.map(c => c.high));

    const range = max - min || 1;

    const pad = {
        top: 12,
        bottom: 12,
        left: 8,
        right: 62
    };

    const plotW = w - pad.left - pad.right;

    const plotH = h - pad.top - pad.bottom;

    const y = v =>
        pad.top + (max - v) / range * plotH;

    const step = plotW / visible.length;

    const cw = Math.max(2, step * .62);

    /* GRID */

    ctx.strokeStyle = 'rgba(255,255,255,.055)';

    ctx.fillStyle = '#8092a5';

    ctx.font = '10px sans-serif';

    for (let i = 0; i < 5; i++) {

        let yy = pad.top + i * plotH / 4;

        ctx.beginPath();

        ctx.moveTo(pad.left, yy);

        ctx.lineTo(pad.left + plotW, yy);

        ctx.stroke();

        ctx.fillText(
            (max - i * range / 4).toFixed(2),
            pad.left + plotW + 6,
            yy + 3
        );

    }

    /* CANDLES */

    visible.forEach((c, i) => {

        let x = pad.left + i * step + step / 2;

        let up = c.close >= c.open;

        let color = up ? '#31d69a' : '#ff6577';

        ctx.strokeStyle = color;

        ctx.fillStyle = color;

        ctx.beginPath();

        ctx.moveTo(x, y(c.high));

        ctx.lineTo(x, y(c.low));

        ctx.stroke();

        let top = Math.min(y(c.open), y(c.close));

        let body = Math.max(
            1,
            Math.abs(y(c.open) - y(c.close))
        );

        ctx.fillRect(x - cw / 2, top, cw, body);

    });

    /* CURRENT PRICE */

    if (liveQuote !== null) {

        ctx.fillStyle = '#47d7f4';

        ctx.font = 'bold 11px sans-serif';

        ctx.fillText(
            liveQuote.toFixed(2),
            pad.left + plotW + 6,
            y(liveQuote)
        );

    }

}

window.addEventListener('resize', drawChart);

/* RSI */

function rsi(values, period = 14) {

    if (values.length <= period) return null;

    let gains = 0;

    let losses = 0;

    for (let i = values.length - period; i < values.length; i++) {

        let d = values[i] - values[i - 1];

        if (d > 0) {
            gains += d;
        } else {
            losses -= d;
        }

    }

    if (losses === 0) return 100;

    return 100 - (100 / (1 + gains / losses));

}

/* STATISTICS */

function candleStats(cs) {

    const closes = cs.map(c => c.close);

    const last = cs.at(-1);

    const prev = cs.at(-2);

    const r = rsi(closes);

    return {

        closes,

        last,

        prev,

        rsi: r,

        trend:
            closes.at(-1) > closes.at(-5)
                ? 'up'
                : closes.at(-1) < closes.at(-5)
                    ? 'down'
                    : 'sideways'

    };

}

/* AI PROMPT */

function makePrompt() {

    const data = candles.slice(-20);

    if (data.length < 8) {

        throw new Error(
            'Недостаточно свечей. Дождитесь загрузки графика.'
        );

    }

    const s = candleStats(data);

    return `Ты анализируешь краткосрочный график синтетического индекса Deriv Volatility 100 (1s).

Таймфрейм: ${tf}.

Данные OHLC последних ${data.length} свечей:
${JSON.stringify(data)}

RSI(14):
${s.rsi === null ? 'недостаточно данных' : s.rsi.toFixed(2)}

Общая динамика:
${s.trend}

Текущая цена:
${liveQuote ?? s.last.close}

Сделай осторожную техническую оценку следующего движения.

Не выдумывай данные.
Если сигналы слабые или противоречивые, выбери NEUTRAL.
Вероятность — субъективная оценка модели, не статистически подтвержденная.

Верни ТОЛЬКО JSON:

{
  "direction": "RISE|FALL|NEUTRAL",
  "confidence": 0-100,
  "candles": ${Math.min(20, data.length)},
  "reason": "короткое объяснение на русском"
}`;

}

/* AI REQUEST */

async function callAI(prompt) {

    const provider =
        getSaved('spartan_ai_provider') || $('provider').value;

    const key =
        getSaved('spartan_ai_key') || $('aiKey').value.trim();

    if (!key) {

        throw new Error(
            'Сначала добавьте API-ключ AI в настройках (⚙).'
        );

    }

    let response;

    let text;

    /* DEEPSEEK */

    if (provider === 'deepseek') {

        response = await fetch(
            'https://api.deepseek.com/chat/completions',
            {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${key}`
                },

                body: JSON.stringify({

                    model: 'deepseek-chat',

                    messages: [

                        {
                            role: 'system',
                            content: 'Ты технический аналитик. Отвечай только валидным JSON.'
                        },

                        {
                            role: 'user',
                            content: prompt
                        }

                    ],

                    temperature: 0.2

                })

            }
        );

        const j = await response.json();

        if (!response.ok) {

            throw new Error(
                j.error?.message || 'DeepSeek API error'
            );

        }

        text = j.choices?.[0]?.message?.content;

    }

    /* OPENAI */

    else if (provider === 'openai') {

        response = await fetch(
            'https://api.openai.com/v1/chat/completions',
            {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${key}`
                },

                body: JSON.stringify({

                    model: 'gpt-4o-mini',

                    messages: [

                        {
                            role: 'system',
                            content: 'You are a cautious technical analyst. Return only valid JSON.'
                        },

                        {
                            role: 'user',
                            content: prompt
                        }

                    ],

                    temperature: 0.2

                })

            }
        );

        const j = await response.json();

        if (!response.ok) {

            throw new Error(
                j.error?.message || 'OpenAI API error'
            );

        }

        text = j.choices?.[0]?.message?.content;

    }

    /* GEMINI */

    else {

        response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(key)}`,
            {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({

                    contents: [
                        {
                            parts: [
                                {
                                    text: prompt
                                }
                            ]
                        }
                    ],

                    generationConfig: {
                        temperature: 0.2,
                        responseMimeType: 'application/json'
                    }

                })

            }
        );

        const j = await response.json();

        if (!response.ok) {

            throw new Error(
                j.error?.message || 'Gemini API error'
            );

        }

        text = j.candidates?.[0]?.content?.parts
            ?.map(p => p.text || '')
            .join('');

    }

    if (!text) {

        throw new Error('AI вернул пустой ответ');

    }

    /* PARSE AI JSON */

    const cleaned = text
        .replace(/```(?:json)?/gi, '')
        .replace(/```/g, '')
        .trim();

    const parsed = JSON.parse(cleaned);

    if (
        !['RISE', 'FALL', 'NEUTRAL']
        .includes(parsed.direction)
    ) {

        throw new Error(
            'Неизвестное направление в ответе AI'
        );

    }

    parsed.confidence = Math.max(
        0,
        Math.min(100, Number(parsed.confidence) || 0)
    );

    parsed.candles = Math.max(
        1,
        Math.min(20, Number(parsed.candles) || dataCount())
    );

    parsed.reason = String(
        parsed.reason || 'Нет объяснения'
    );

    return parsed;

}

function dataCount() {

    return Math.min(20, candles.length);

}

/* RENDER SIGNAL */

function renderSignal(s) {

    $('signalBox').classList.add('show');

    const d = s.direction;

    const cls =
        d === 'RISE'
            ? 'rise'
            : d === 'FALL'
                ? 'fall'
                : 'neutral';

    $('direction').className = 'direction ' + cls;

    $('arrow').textContent =
        d === 'RISE'
            ? '↗'
            : d === 'FALL'
                ? '↘'
                : '—';

    $('directionText').textContent =
        d === 'RISE'
            ? tr('rise')
            : d === 'FALL'
                ? tr('fall')
                : tr('neutral');

    $('probability').innerHTML =
        `${tr('prob')} <strong>${s.confidence}%</strong>`;

    $('candlePill').innerHTML =
        `📊 ${tr('candles')}<b>${s.candles}</b>`;

    $('timePill').innerHTML =
        `🕒 ${tr('time')}<b>${tf}</b>`;

    $('reason').textContent = s.reason;

    $('engineLabel').textContent =
        ($('provider').value || 'AI').toUpperCase()
        + ' ENGINE';

}

/* ANALYZE BUTTON */

$('analyzeBtn').onclick = async () => {

    if (busy) return;

    busy = true;

    $('analyzeBtn').disabled = true;

    $('analyzeBtn').textContent = tr('working');

    $('errorBox').textContent = '';

    try {

        const result = await callAI(makePrompt());

        renderSignal(result);

    } catch (e) {

        $('errorBox').textContent =
            e.message || String(e);

    } finally {

        busy = false;

        $('analyzeBtn').disabled = false;

        $('analyzeBtn').textContent = tr('analyze');

    }

};

/* START */

connectDeriv();

})();

</script>
