<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spartan Signal</title>

<style>
:root {
    --bg-main: #080E14;
    --bg-card: #0F1822;
    --bg-input: #091017;
    --border-color: #1D2D3E;
    --text-primary: #FFFFFF;
    --text-secondary: #8A9BB0;
    --accent-cyan: #00F0FF;
    --accent-green: #00E676;
    --accent-red: #FF3D57;
    --btn-gradient: linear-gradient(90deg,#00E5FF,#00E676);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: var(--bg-main);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 12px 16px 24px;
    overflow-x: hidden;
    user-select: none;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.logo-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-icon {
    width: 28px;
    height: 28px;
}

.logo-text {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .3px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.gear-btn {
    width: 34px;
    height: 34px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    cursor: pointer;
}

.gear-btn.active {
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
    background: #113542;
}

.lang-switch {
    display: flex;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 3px;
}

.lang-btn {
    padding: 5px 11px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
}

.lang-btn.active {
    background: #133A46;
    color: var(--accent-cyan);
}

.settings-panel {
    display: none;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
}

.settings-panel.open {
    display: block;
}

.input-group {
    margin-bottom: 12px;
}

.input-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: .8px;
    text-transform: uppercase;
    margin-bottom: 6px;
}

.api-input,
.api-select {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 11px 12px;
    color: var(--text-primary);
    font-size: 13px;
    outline: none;
    user-select: text;
}

.api-input:focus,
.api-select:focus {
    border-color: var(--accent-cyan);
}

.save-settings-btn {
    width: 100%;
    margin-top: 8px;
    padding: 11px;
    border: none;
    border-radius: 12px;
    background: #133A46;
    color: var(--accent-cyan);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}

.card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 12px 16px;
    margin-bottom: 12px;
}

.mode-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.mode-left {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
}

.mode-badge {
    background: #113542;
    color: var(--accent-cyan);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
}

.asset-card {
    display: flex;
    align-items: center;
    gap: 12px;
}

.asset-icon {
    width: 38px;
    height: 38px;
    background: #162434;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.asset-title {
    font-size: 15px;
    font-weight: 600;
}

.asset-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
}

.chart-container {
    position: relative;
    width: 100%;
    height: 260px;
    background: var(--bg-main);
    border-radius: 12px;
    margin: 6px 0 14px;
    overflow: hidden;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.status-dot {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 2;
    font-size: 11px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(15,24,34,.88);
    padding: 5px 8px;
    border-radius: 8px;
}

.dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-green);
    box-shadow: 0 0 8px var(--accent-green);
}

.dot.offline {
    background: var(--accent-red);
    box-shadow: 0 0 8px var(--accent-red);
}

.timeframes {
    display: flex;
    justify-content: space-between;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 5px;
    margin-bottom: 14px;
}

.tf-btn {
    flex: 1;
    text-align: center;
    padding: 8px 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    border-radius: 12px;
    cursor: pointer;
    background: transparent;
    border: 0;
}

.tf-btn.active {
    background: #143B47;
    color: var(--accent-cyan);
}

.action-btn {
    width: 100%;
    height: 54px;
    border: none;
    border-radius: 16px;
    background: var(--btn-gradient);
    color: #041014;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,230,118,.25);
    margin-bottom: 14px;
}

.action-btn:active {
    transform: scale(.98);
}

.action-btn.analyzing {
    background: #131D27;
    color: #5C6E82;
    box-shadow: none;
    border: 1px solid var(--border-color);
}

.signal-box {
    display: none;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
}

.signal-box.visible {
    display: block;
}

.signal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: .8px;
    margin-bottom: 12px;
}

.ai-badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 6px;
    background: rgba(0,240,255,.12);
    color: var(--accent-cyan);
}

.loader-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 18px 0;
    color: var(--text-secondary);
    font-size: 14px;
}

.spinner {
    width: 24px;
    height: 24px;
    border: 3px solid rgba(0,230,118,.2);
    border-top-color: var(--accent-green);
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

.result-grid {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.result-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.direction-icon {
    width: 54px;
    height: 54px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: bold;
}

.direction-icon.rise {
    background: rgba(0,230,118,.12);
    border: 1px solid rgba(0,230,118,.4);
    color: var(--accent-green);
}

.direction-icon.fall {
    background: rgba(255,61,87,.12);
    border: 1px solid rgba(255,61,87,.4);
    color: var(--accent-red);
}

.direction-icon.neutral {
    background: rgba(138,155,176,.12);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
}

.direction-title {
    font-size: 24px;
    font-weight: 700;
}

.prob-text {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
}

.prob-val {
    font-weight: 700;
}

.result-right {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12px;
    color: #C8D4E3;
}

.meta-row {
    display: flex;
    align-items: center;
    gap: 6px;
}

.reason {
    margin-top: 14px;
    border-top: 1px solid var(--border-color);
    padding-top: 12px;
    font-size: 12px;
    color: #C8D4E3;
    line-height: 1.4;
}

.disclaimer {
    font-size: 10px;
    line-height: 1.5;
    color: #617286;
    margin-top: 12px;
    text-align: center;
}

.error-box {
    color: var(--accent-red);
    font-size: 12px;
    margin: 0 0 12px;
    white-space: pre-wrap;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="header">

    <div class="logo-wrap">

        <svg class="logo-icon" viewBox="0 0 32 32" fill="none">
            <path d="M3 17H9L13 7L19 25L23 15H29"
                  stroke="url(#logo_grad)"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>

            <defs>
                <linearGradient id="logo_grad"
                    x1="3" y1="16"
                    x2="29" y2="16"
                    gradientUnits="userSpaceOnUse">

                    <stop stop-color="#00E5FF"/>
                    <stop offset="1" stop-color="#00E676"/>

                </linearGradient>
            </defs>
        </svg>

        <span class="logo-text">Spartan Signal</span>

    </div>

    <div class="header-right">

        <button id="gearBtn" class="gear-btn">

            <svg width="18" height="18"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <circle cx="12" cy="12" r="3"/>

                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>

            </svg>

        </button>

        <div class="lang-switch">

            <div class="lang-btn active" data-lang="ru">RU</div>
            <div class="lang-btn" data-lang="en">EN</div>

        </div>

    </div>

</div>

<!-- SETTINGS -->

<div id="settingsPanel" class="settings-panel">

    <div class="input-group">

        <label class="input-label">МОДЕЛЬ НЕЙРОСЕТИ</label>

        <select id="aiProviderInput" class="api-select">

            <option value="openai">OpenAI (GPT-4o-mini)</option>
            <option value="deepseek">DeepSeek</option>
            <option value="gemini">Google Gemini</option>

        </select>

    </div>

    <div class="input-group">

        <label class="input-label">API НЕЙРОСЕТЬ</label>

        <input
            id="aiKeyInput"
            type="password"
            class="api-input"
            placeholder="Вставьте API-ключ нейросети"
        >

    </div>

    <div class="input-group">

        <label class="input-label">API DERIV</label>

        <input
            id="derivKeyInput"
            type="password"
            class="api-input"
            placeholder="App ID Deriv (необязательно)"
        >

    </div>

    <button id="saveSettingsBtn" class="save-settings-btn">
        Сохранить и обновить
    </button>

</div>

<!-- MODE -->

<div class="card">

    <div class="mode-bar">

        <div class="mode-left">
            <span>◉</span>
            <span data-i18n="mode">РЕЖИМ</span>
        </div>

        <div class="mode-badge">Rise / Fall</div>

    </div>

</div>

<!-- ASSET -->

<div class="card">

    <div class="asset-card">

        <div class="asset-icon">📈</div>

        <div>

            <div class="asset-title">
                Volatility 100 (1s) Index
            </div>

            <div class="asset-sub">
                Synthetic Index · Deriv
            </div>

        </div>

    </div>

</div>

<!-- CHART -->

<div class="chart-container">

    <div class="status-dot">

        <span id="wsDot" class="dot offline"></span>

        <span id="wsStatus">Подключение...</span>

    </div>

    <canvas id="priceChart"></canvas>

</div>

<!-- TIMEFRAMES -->

<div class="timeframes">

    <button class="tf-btn active" data-tf="1m">1m</button>
    <button class="tf-btn" data-tf="5m">5m</button>
    <button class="tf-btn" data-tf="15m">15m</button>
    <button class="tf-btn" data-tf="30m">30m</button>
    <button class="tf-btn" data-tf="1h">1h</button>

</div>

<!-- SIGNAL BUTTON -->

<button id="signalBtn" class="action-btn">
    СИГНАЛ
</button>

<div class="error-box" id="errorBox"></div>

<!-- SIGNAL BOX -->

<div id="signalBox" class="signal-box">

    <div class="signal-header">

        <span data-i18n="signalTitle">СИГНАЛ</span>

        <span id="engineBadge" class="ai-badge">
            AI ENGINE
        </span>

    </div>

    <div id="loaderState" class="loader-wrap">

        <div class="spinner"></div>

        <span data-i18n="analyzingText">
            ИИ анализирует график...
        </span>

    </div>

    <div id="resultState" class="result-grid" style="display:none">

        <div class="result-left">

            <div id="dirIcon" class="direction-icon">
                ↗
            </div>

            <div>

                <div id="dirText" class="direction-title">
                    Rise
                </div>

                <div class="prob-text">

                    <span data-i18n="probLabel">Вероятность:</span>

                    <span id="probVal" class="prob-val">--</span>

                </div>

            </div>

        </div>

        <div class="result-right">

            <div class="meta-row">
                📊 <span id="candlesText">--</span>
            </div>

            <div class="meta-row">
                🕒 <span id="timeWindow">--</span>
            </div>

        </div>

    </div>

    <div id="reasonText" class="reason" style="display:none"></div>

</div>

<p class="disclaimer" data-i18n="disclaimer">
    Анализ является технической оценкой рынка и не гарантирует результат.
</p>

<script>
(() => {

'use strict';

const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();

    try {
        tg.setHeaderColor('#080E14');
        tg.setBackgroundColor('#080E14');
    } catch (e) {}
}

/* ELEMENTS */

const settingsPanel = document.getElementById('settingsPanel');
const gearBtn = document.getElementById('gearBtn');

const aiProviderInput =
    document.getElementById('aiProviderInput');

const aiKeyInput =
    document.getElementById('aiKeyInput');

const derivKeyInput =
    document.getElementById('derivKeyInput');

const signalBtn =
    document.getElementById('signalBtn');

const signalBox =
    document.getElementById('signalBox');

const loaderState =
    document.getElementById('loaderState');

const resultState =
    document.getElementById('resultState');

const errorBox =
    document.getElementById('errorBox');

/* SETTINGS */

aiProviderInput.value =
    localStorage.getItem('spartan_ai_provider') || 'openai';

aiKeyInput.value =
    localStorage.getItem('spartan_ai_key') || '';

derivKeyInput.value =
    localStorage.getItem('spartan_deriv_key') || '';

gearBtn.addEventListener('click', () => {

    if (tg?.HapticFeedback) {
        tg.HapticFeedback.selectionChanged();
    }

    settingsPanel.classList.toggle('open');

    gearBtn.classList.toggle('active');

});

document.getElementById('saveSettingsBtn')
    .addEventListener('click', () => {

        if (tg?.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success');
        }

        localStorage.setItem(
            'spartan_ai_provider',
            aiProviderInput.value
        );

        localStorage.setItem(
            'spartan_ai_key',
            aiKeyInput.value.trim()
        );

        localStorage.setItem(
            'spartan_deriv_key',
            derivKeyInput.value.trim()
        );

        settingsPanel.classList.remove('open');

        gearBtn.classList.remove('active');

        connectDeriv();

    });

/* LANGUAGE */

const i18n = {

    ru: {
        mode: 'РЕЖИМ',
        btnSignal: 'СИГНАЛ',
        btnAnalyzing: 'АНАЛИЗ ИИ',
        signalTitle: 'СИГНАЛ',
        analyzingText: 'ИИ анализирует график...',
        probLabel: 'Вероятность:',
        connected: 'Deriv Live',
        connecting: 'Подключение Deriv...',
        candles: 'свечей',
        disclaimer:
            'Анализ является технической оценкой рынка и не гарантирует результат.',
        rise: 'Rise',
        fall: 'Fall',
        neutral: 'Нет сигнала'
    },

    en: {
        mode: 'MODE',
        btnSignal: 'SIGNAL',
        btnAnalyzing: 'AI ANALYZING',
        signalTitle: 'SIGNAL',
        analyzingText: 'AI analyzing market...',
        probLabel: 'Probability:',
        connected: 'Deriv Live',
        connecting: 'Connecting Deriv...',
        candles: 'candles',
        disclaimer:
            'Technical market analysis. No outcome is guaranteed.',
        rise: 'Rise',
        fall: 'Fall',
        neutral: 'No signal'
    }

};

let currentLang = 'ru';

function setLanguage(lang) {

    currentLang = lang;

    document.querySelectorAll('.lang-btn').forEach(btn => {

        btn.classList.toggle(
            'active',
            btn.dataset.lang === lang
        );

    });

    document.querySelectorAll('[data-i18n]').forEach(el => {

        const key = el.dataset.i18n;

        if (i18n[lang][key]) {
            el.textContent = i18n[lang][key];
        }

    });

    if (!isAnalyzing) {
        signalBtn.textContent = i18n[lang].btnSignal;
    }

    if (ws && ws.readyState === 1) {
        document.getElementById('wsStatus').textContent =
            i18n[lang].connected;
    }

}

document.querySelectorAll('.lang-btn').forEach(btn => {

    btn.addEventListener('click', () => {

        if (tg?.HapticFeedback) {
            tg.HapticFeedback.selectionChanged();
        }

        setLanguage(btn.dataset.lang);

    });

});

/* TIMEFRAMES */

let currentTf = '1m';

const timeframeSettings = {
    '1m': 60,
    '5m': 300,
    '15m': 900,
    '30m': 1800,
    '1h': 3600
};

document.querySelectorAll('.tf-btn').forEach(btn => {

    btn.addEventListener('click', () => {

        if (tg?.HapticFeedback) {
            tg.HapticFeedback.selectionChanged();
        }

        document.querySelectorAll('.tf-btn').forEach(b => {
            b.classList.remove('active');
        });

        btn.classList.add('active');

        currentTf = btn.dataset.tf;

        signalBox.classList.remove('visible');

    });

});

/* DERIV LIVE WEBSOCKET */

const SYMBOL = '1HZ100V';

let ws = null;

let prices = [];

let reconnectTimer = null;

let reconnectAttempts = 0;

let isAnalyzing = false;

function setConnection(ok, text) {

    document.getElementById('wsDot')
        .classList.toggle('offline', !ok);

    document.getElementById('wsStatus')
        .textContent = text;

}

function connectDeriv() {

    clearTimeout(reconnectTimer);

    if (ws) {
        try {
            ws.onclose = null;
            ws.close();
        } catch (_) {}
    }

    prices = [];

    drawChart();

    const savedAppId =
        localStorage.getItem('spartan_deriv_key') || '';

    const appId =
        /^\d+$/.test(savedAppId)
            ? savedAppId
            : '1089';

    setConnection(false, i18n[currentLang].connecting);

    try {

        ws = new WebSocket(
            `wss://ws.derivws.com/websockets/v3?app_id=${encodeURIComponent(appId)}`
        );

    } catch (e) {

        reconnect();

        return;

    }

    ws.onopen = () => {

        reconnectAttempts = 0;

        /* Historical ticks */

        ws.send(JSON.stringify({

            ticks_history: SYMBOL,

            count: 100,

            end: 'latest',

            style: 'ticks'

        }));

    };

    ws.onmessage = event => {

        let data;

        try {
            data = JSON.parse(event.data);
        } catch (_) {
            return;
        }

        if (data.error) {

            setConnection(false, data.error.message);

            return;

        }

        /* HISTORY */

        if (data.msg_type === 'history' && data.history) {

            prices = data.history.prices.map(Number);

            drawChart();

            /* Subscribe to live ticks */

            ws.send(JSON.stringify({

                ticks: SYMBOL,

                subscribe: 1

            }));

            setConnection(
                true,
                i18n[currentLang].connected
            );

        }

        /* LIVE TICK */

        if (data.msg_type === 'tick' && data.tick) {

            const quote = Number(data.tick.quote);

            prices.push(quote);

            if (prices.length > 120) {
                prices.shift();
            }

            drawChart();

            setConnection(
                true,
                i18n[currentLang].connected
            );

        }

    };

    ws.onerror = () => {

        setConnection(false, 'Ошибка WebSocket');

    };

    ws.onclose = () => {

        setConnection(false, 'Переподключение...');

        reconnect();

    };

}

function reconnect() {

    reconnectAttempts++;

    const delay = Math.min(
        1000 * reconnectAttempts,
        10000
    );

    reconnectTimer = setTimeout(connectDeriv, delay);

}

/* CHART */

const canvas =
    document.getElementById('priceChart');

const ctx =
    canvas.getContext('2d');

function drawChart() {

    const rect = canvas.getBoundingClientRect();

    if (!rect.width || !rect.height) return;

    const dpr = window.devicePixelRatio || 1;

    canvas.width = Math.round(rect.width * dpr);

    canvas.height = Math.round(rect.height * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const w = rect.width;

    const h = rect.height;

    const rightPad = 72;

    const plotW = w - rightPad;

    ctx.clearRect(0, 0, w, h);

    if (prices.length < 2) {

        ctx.fillStyle = '#8A9BB0';

        ctx.font = '12px sans-serif';

        ctx.fillText('Загрузка графика...', 12, 40);

        return;

    }

    const min = Math.min(...prices);

    const max = Math.max(...prices);

    const range = max - min || 0.0001;

    const padY = h * 0.14;

    const getY = val =>
        h - padY - ((val - min) / range) * (h - padY * 2);

    const getX = idx =>
        (idx / (prices.length - 1)) * (plotW - 15);

    /* GRID */

    ctx.strokeStyle = 'rgba(255,255,255,0.05)';

    ctx.fillStyle = '#8A9BB0';

    ctx.font = '11px sans-serif';

    ctx.lineWidth = 1;

    for (let i = 0; i <= 4; i++) {

        const val = min + (range / 4) * i;

        const y = getY(val);

        ctx.beginPath();

        ctx.moveTo(0, y);

        ctx.lineTo(plotW, y);

        ctx.stroke();

        ctx.fillText(
            val.toFixed(2),
            plotW + 10,
            y + 4
        );

    }

    /* GRADIENT */

    const gradient = ctx.createLinearGradient(
        0, padY, 0, h
    );

    gradient.addColorStop(
        0,
        'rgba(255,255,255,0.16)'
    );

    gradient.addColorStop(
        1,
        'rgba(8,14,20,0)'
    );

    /* AREA */

    ctx.beginPath();

    ctx.moveTo(getX(0), h);

    prices.forEach((p, i) => {
        ctx.lineTo(getX(i), getY(p));
    });

    ctx.lineTo(
        getX(prices.length - 1),
        h
    );

    ctx.closePath();

    ctx.fillStyle = gradient;

    ctx.fill();

    /* PRICE LINE */

    ctx.beginPath();

    prices.forEach((p, i) => {

        if (i === 0) {
            ctx.moveTo(getX(i), getY(p));
        } else {
            ctx.lineTo(getX(i), getY(p));
        }

    });

    ctx.strokeStyle = '#FFFFFF';

    ctx.lineWidth = 2;

    ctx.stroke();

    /* LAST PRICE */

    const lastPrice = prices[prices.length - 1];

    const lastX = getX(prices.length - 1);

    const lastY = getY(lastPrice);

    ctx.beginPath();

    ctx.moveTo(lastX, lastY);

    ctx.lineTo(plotW + 4, lastY);

    ctx.strokeStyle = 'rgba(255,255,255,0.7)';

    ctx.lineWidth = 1.5;

    ctx.stroke();

    ctx.beginPath();

    ctx.arc(lastX, lastY, 4.5, 0, Math.PI * 2);

    ctx.fillStyle = '#FFFFFF';

    ctx.fill();

    /* PRICE LABEL */

    ctx.fillStyle = '#FFFFFF';

    ctx.beginPath();

    ctx.roundRect(
        plotW + 4,
        lastY - 11,
        64,
        22,
        6
    );

    ctx.fill();

    ctx.fillStyle = '#080E14';

    ctx.font = 'bold 11px sans-serif';

    ctx.fillText(
        lastPrice.toFixed(2),
        plotW + 10,
        lastY + 4
    );

}

window.addEventListener('resize', drawChart);

/* MOSCOW TIME */

function getMskTimeWindow(candlesCount) {

    const now = new Date();

    const seconds =
        timeframeSettings[currentTf] || 60;

    const end = new Date(
        now.getTime() +
        seconds * candlesCount * 1000
    );

    const format = date =>
        date.toLocaleTimeString('ru-RU', {
            timeZone: 'Europe/Moscow',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        });

    return `${format(now)} – ${format(end)} (МСК)`;

}

/* DISPLAY SIGNAL */

function renderSignal(signal) {

    const dirIcon =
        document.getElementById('dirIcon');

    const dirText =
        document.getElementById('dirText');

    const probVal =
        document.getElementById('probVal');

    document.getElementById('engineBadge')
        .textContent = signal.source || 'AI ENGINE';

    if (signal.direction === 'Rise') {

        dirIcon.className =
            'direction-icon rise';

        dirIcon.textContent = '↗';

        dirText.textContent =
            i18n[currentLang].rise;

        probVal.style.color =
            '#00E676';

    } else if (signal.direction === 'Fall') {

        dirIcon.className =
            'direction-icon fall';

        dirIcon.textContent = '↘';

        dirText.textContent =
            i18n[currentLang].fall;

        probVal.style.color =
            '#FF3D57';

    } else {

        dirIcon.className =
            'direction-icon neutral';

        dirIcon.textContent = '—';

        dirText.textContent =
            i18n[currentLang].neutral;

        probVal.style.color =
            '#8A9BB0';

    }

    probVal.textContent =
        `${signal.probability}%`;

    document.getElementById('candlesText')
        .textContent =
            `${signal.candles} ${i18n[currentLang].candles}`;

    document.getElementById('timeWindow')
        .textContent =
            getMskTimeWindow(signal.candles);

    document.getElementById('reasonText')
        .textContent = signal.reason;

    document.getElementById('reasonText')
        .style.display = 'block';

    loaderState.style.display = 'none';

    resultState.style.display = 'flex';

}

/* ANALYSIS */

signalBtn.addEventListener('click', async () => {

    if (isAnalyzing) return;

    if (prices.length < 10) {

        errorBox.textContent =
            'Недостаточно данных графика. Дождитесь подключения.';

        return;

    }

    const aiKey =
        localStorage.getItem('spartan_ai_key') || '';

    if (!aiKey) {

        errorBox.textContent =
            'Добавьте API-ключ нейросети в настройки ⚙';

        settingsPanel.classList.add('open');

        gearBtn.classList.add('active');

        return;

    }

    if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
    }

    errorBox.textContent = '';

    isAnalyzing = true;

    signalBtn.disabled = true;

    signalBtn.classList.add('analyzing');

    signalBtn.textContent =
        i18n[currentLang].btnAnalyzing;

    signalBox.classList.add('visible');

    loaderState.style.display = 'flex';

    resultState.style.display = 'none';

    document.getElementById('reasonText')
        .style.display = 'none';

    try {

        const res = await fetch(
            '/.netlify/functions/market',
            {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({

                    action: 'analyze',

                    timeframe: currentTf,

                    lang: currentLang,

                    prices: prices.slice(-100),

                    aiKey: aiKey,

                    aiProvider:
                        localStorage.getItem(
                            'spartan_ai_provider'
                        ) || 'openai'

                })

            }
        );

        const signal = await res.json();

        if (!res.ok || !signal.ok) {

            throw new Error(
                signal.error || 'Ошибка анализа'
            );

        }

        renderSignal(signal);

        if (tg?.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success');
        }

    } catch (e) {

        loaderState.style.display = 'none';

        resultState.style.display = 'none';

        document.getElementById('reasonText')
            .style.display = 'block';

        document.getElementById('reasonText')
            .textContent = e.message || 'Ошибка анализа';

        errorBox.textContent =
            e.message || 'Не удалось получить сигнал';

    }

    isAnalyzing = false;

    signalBtn.disabled = false;

    signalBtn.classList.remove('analyzing');

    signalBtn.textContent =
        i18n[currentLang].btnSignal;

});

/* START */

connectDeriv();

})();
</script>
