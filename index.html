
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spartan Signal</title>

<style>
:root {
    --bg-main: #080E14;
    --bg-card: #0F1822;
    --border-color: #1D2D3E;
    --text-primary: #FFFFFF;
    --text-secondary: #8A9BB0;
    --accent-cyan: #00F0FF;
    --accent-green: #00E676;
    --accent-red: #FF3D57;
    --btn-gradient: linear-gradient(90deg, #00E5FF, #00E676);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

body {
    background: var(--bg-main);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 12px 16px 24px;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.logo-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-icon {
    width: 28px;
    height: 28px;
}

.logo-text {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .3px;
}

.lang-switch {
    display: flex;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 3px;
}

.lang-btn {
    padding: 5px 12px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
}

.lang-btn.active {
    background: #133A46;
    color: var(--accent-cyan);
}

.card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 12px 16px;
    margin-bottom: 12px;
}

.mode-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.mode-left {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
}

.mode-badge {
    background: #113542;
    color: var(--accent-cyan);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
}

.asset-card {
    display: flex;
    align-items: center;
    gap: 12px;
}

.asset-icon {
    width: 38px;
    height: 38px;
    background: #162434;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.asset-title {
    font-size: 15px;
    font-weight: 600;
}

.asset-sub {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
}

.chart-container {
    position: relative;
    width: 100%;
    height: 270px;
    background: var(--bg-main);
    border-radius: 12px;
    margin: 6px 0 14px;
    overflow: hidden;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.status-dot {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 2;
    font-size: 11px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(15, 24, 34, .88);
    padding: 5px 8px;
    border-radius: 8px;
}

.dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-green);
    box-shadow: 0 0 8px var(--accent-green);
}

.dot.offline {
    background: var(--accent-red);
    box-shadow: 0 0 8px var(--accent-red);
}

.timeframes {
    display: flex;
    justify-content: space-between;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 5px;
    margin-bottom: 14px;
}

.tf-btn {
    flex: 1;
    text-align: center;
    padding: 8px 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    border-radius: 12px;
    cursor: pointer;
}

.tf-btn.active {
    background: #143B47;
    color: var(--accent-cyan);
}

.action-btn {
    width: 100%;
    height: 54px;
    border: none;
    border-radius: 16px;
    background: var(--btn-gradient);
    color: #041014;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0, 230, 118, .25);
    margin-bottom: 14px;
}

.action-btn:active {
    transform: scale(.98);
}

.action-btn.analyzing {
    background: #131D27;
    color: #5C6E82;
    box-shadow: none;
    border: 1px solid var(--border-color);
}

.action-btn:disabled {
    cursor: not-allowed;
    opacity: .7;
}

.signal-box {
    display: none;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
}

.signal-box.visible {
    display: block;
}

.signal-header {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: .8px;
    margin-bottom: 12px;
}

.loader-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 18px 0;
    color: var(--text-secondary);
    font-size: 14px;
}

.spinner {
    width: 24px;
    height: 24px;
    border: 3px solid rgba(0, 230, 118, .2);
    border-top-color: var(--accent-green);
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

.result-grid {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.result-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.direction-icon {
    width: 54px;
    height: 54px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: bold;
}

.direction-icon.rise {
    background: rgba(0, 230, 118, .12);
    border: 1px solid rgba(0, 230, 118, .4);
    color: var(--accent-green);
}

.direction-icon.fall {
    background: rgba(255, 61, 87, .12);
    border: 1px solid rgba(255, 61, 87, .4);
    color: var(--accent-red);
}

.direction-title {
    font-size: 24px;
    font-weight: 700;
}

.prob-text {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
}

.prob-val {
    font-weight: 700;
}

.result-right {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12px;
    color: #C8D4E3;
}

.meta-row {
    display: flex;
    align-items: center;
    gap: 6px;
}

.reason {
    margin-top: 14px;
    border-top: 1px solid var(--border-color);
    padding-top: 12px;
    font-size: 12px;
    color: var(--text-secondary);
}

.disclaimer {
    font-size: 10px;
    line-height: 1.5;
    color: #617286;
    margin-top: 12px;
    text-align: center;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@media (max-width: 360px) {
    body {
        padding: 10px;
    }

    .result-grid {
        align-items: flex-start;
    }

    .result-left {
        gap: 8px;
    }

    .direction-icon {
        width: 44px;
        height: 44px;
    }

    .direction-title {
        font-size: 20px;
    }

    .result-right {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<div class="header">

            <path

        <span class="logo-text">Spartan Signal</span>

        <div class="lang-btn" data-lang="en">EN</div>

            <path d="M7.76 16.24a6 6 0 0 1 0-8.49"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>

    </div>

<script>

// ==========================================
// TELEGRAM WEB APP
// ==========================================

const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();

    try {
        tg.setHeaderColor('#080E14');
        tg.setBackgroundColor('#080E14');
    } catch (e) {}
}


// ==========================================
// CONFIGURATION
// ==========================================

// Demo application ID.
// For production, register your own Deriv App ID.

const APP_ID = 1089;

const SYMBOL = '1HZ100V';

const WS_URL =
    `wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`;


// ==========================================
// TRANSLATIONS
// ==========================================

const i18n = {

    ru: {
        mode: 'РЕЖИМ',
        btnSignal: 'СИГНАЛ',
        btnAnalyzing: 'АНАЛИЗ',
        signalTitle: 'СИГНАЛ',
        analyzingText: 'Анализ данных...',
        probLabel: 'Вероятность:',
        connected: 'Deriv Live',
        connecting: 'Подключение к Deriv...',
        disconnected: 'Нет соединения',
        rise: 'Rise',
        fall: 'Fall',
        candles: 'свечей',
        reasonUp: 'Положительный импульс',
        reasonDown: 'Отрицательный импульс',
        reasonWeak: 'Слабый сигнал',
        disclaimer: 'Анализ является технической оценкой рынка и не гарантирует результат.'
    },

    en: {
        mode: 'MODE',
        btnSignal: 'SIGNAL',
        btnAnalyzing: 'ANALYZING',
        signalTitle: 'SIGNAL',
        analyzingText: 'Analyzing market data...',
        probLabel: 'Probability:',
        connected: 'Deriv Live',
        connecting: 'Connecting to Deriv...',
        disconnected: 'Disconnected',
        rise: 'Rise',
        fall: 'Fall',
        candles: 'candles',
        reasonUp: 'Positive momentum',
        reasonDown: 'Negative momentum',
        reasonWeak: 'Weak signal',
        disclaimer: 'Technical market analysis. No outcome is guaranteed.'
    }

};


// ==========================================
// STATE
// ==========================================

let currentLang = 'ru';

let currentTf = '1m';

let prices = [];

let ws = null;

let reconnectTimer = null;

let isAnalyzing = false;

let lastSignal = null;


// Timeframe settings

const timeframeSettings = {

    '1m': {
        seconds: 60,
        candles: 20
    },

    '5m': {
        seconds: 300,
        candles: 20
    },

    '15m': {
        seconds: 900,
        candles: 20
    },

    '30m': {
        seconds: 1800,
        candles: 20
    },

    '1h': {
        seconds: 3600,
        candles: 20
    }

};


// ==========================================
// LANGUAGE SWITCH
// ==========================================

document.querySelectorAll('.lang-btn').forEach(btn => {

    btn.addEventListener('click', () => {

        if (tg?.HapticFeedback) {
            tg.HapticFeedback.selectionChanged();
        }

        document.querySelectorAll('.lang-btn').forEach(b => {
            b.classList.remove('active');
        });

        btn.classList.add('active');

        currentLang = btn.dataset.lang;

        updateLanguage();

    });

});


function updateLanguage() {

    document.querySelectorAll('[data-i18n]').forEach(el => {

        const key = el.dataset.i18n;

        if (i18n[currentLang][key]) {
            el.textContent = i18n[currentLang][key];
        }

    });

    if (!isAnalyzing) {
        signalBtn.textContent = i18n[currentLang].btnSignal;
    }

    document.getElementById('wsStatus').textContent =
        ws && ws.readyState === WebSocket.OPEN
        ? i18n[currentLang].connected
        : i18n[currentLang].connecting;

    if (lastSignal) {
        renderSignal(lastSignal);
    }

}


// ==========================================
// TIMEFRAME SWITCH
// ==========================================

document.querySelectorAll('.tf-btn').forEach(btn => {

    btn.addEventListener('click', () => {

        if (tg?.HapticFeedback) {
            tg.HapticFeedback.selectionChanged();
        }

        document.querySelectorAll('.tf-btn').forEach(b => {
            b.classList.remove('active');
        });

        btn.classList.add('active');

        currentTf = btn.dataset.tf;

        // Reset previous signal
        lastSignal = null;

        document.getElementById('signalBox').classList.remove('visible');

    });

});


// ==========================================
// DERIV CONNECTION
// ==========================================

function connectDeriv() {

    clearTimeout(reconnectTimer);

    if (ws) {
        try {
            ws.onclose = null;
            ws.close();
        } catch (e) {}
    }

    prices = [];

    updateStatus(false, i18n[currentLang].connecting);

    try {

        ws = new WebSocket(WS_URL);

    } catch (error) {

        updateStatus(false, i18n[currentLang].disconnected);

        reconnectTimer = setTimeout(connectDeriv, 3000);

        return;

    }


    ws.onopen = () => {

        updateStatus(true, i18n[currentLang].connected);

        // Request historical ticks

        ws.send(JSON.stringify({

            ticks_history: SYMBOL,

            adjust_start_time: 1,

            count: 80,

            end: 'latest',

            style: 'ticks'

        }));

    };


    ws.onmessage = (event) => {

        let data;

        try {
            data = JSON.parse(event.data);
        } catch (e) {
            return;
        }


        if (data.error) {

            console.error('Deriv API:', data.error.message);

            updateStatus(false, data.error.message);

            return;

        }


        // Historical prices

        if (data.history && data.history.prices) {

            prices = data.history.prices.map(Number);

            drawChart();

            // Subscribe to live ticks

            ws.send(JSON.stringify({

                ticks: SYMBOL,

                subscribe: 1

            }));

        }


        // Live tick

        if (data.tick && data.tick.quote !== undefined) {

            const price = Number(data.tick.quote);

            if (Number.isFinite(price)) {

                prices.push(price);

                if (prices.length > 120) {
                    prices.shift();
                }

                drawChart();

            }

        }

    };


    ws.onerror = () => {

        updateStatus(false, i18n[currentLang].disconnected);

    };


    ws.onclose = () => {

        updateStatus(false, i18n[currentLang].disconnected);

        reconnectTimer = setTimeout(connectDeriv, 3000);

    };

}


function updateStatus(online, text) {

    const dot = document.getElementById('wsDot');

    dot.classList.toggle('offline', !online);

    document.getElementById('wsStatus').textContent = text;

}


// ==========================================
// CHART
// ==========================================

const canvas = document.getElementById('priceChart');

const ctx = canvas.getContext('2d');


function drawChart() {

    const rect = canvas.getBoundingClientRect();

    if (!rect.width || !rect.height) return;

    const dpr = window.devicePixelRatio || 1;

    canvas.width = Math.round(rect.width * dpr);

    canvas.height = Math.round(rect.height * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);


    const w = rect.width;

    const h = rect.height;

    const rightPad = 72;

    const plotW = w - rightPad;

    ctx.clearRect(0, 0, w, h);


    if (prices.length < 2) {

        ctx.fillStyle = '#8A9BB0';

        ctx.font = '13px sans-serif';

        ctx.fillText('Waiting for market data...', 15, h / 2);

        return;

    }


    const min = Math.min(...prices);

    const max = Math.max(...prices);

    const range = max - min || 0.0001;

    const padY = h * 0.14;


    const getY = value => {

        return h - padY -
            ((value - min) / range) *
            (h - padY * 2);

    };


    const getX = index => {

        return (index / (prices.length - 1)) *
            (plotW - 15);

    };


    // Grid

    ctx.strokeStyle = 'rgba(255,255,255,0.05)';

    ctx.fillStyle = '#8A9BB0';

    ctx.font = '11px sans-serif';

    ctx.lineWidth = 1;


    for (let i = 0; i <= 4; i++) {

        const value = min + (range / 4) * i;

        const y = getY(value);

        ctx.beginPath();

        ctx.moveTo(0, y);

        ctx.lineTo(plotW, y);

        ctx.stroke();

        ctx.fillText(
            value.toFixed(2),
            plotW + 10,
            y + 4
        );

    }


    // Area gradient

    const gradient = ctx.createLinearGradient(0, padY, 0, h);

    gradient.addColorStop(0, 'rgba(255,255,255,0.16)');

    gradient.addColorStop(1, 'rgba(8,14,20,0)');


    ctx.beginPath();

    ctx.moveTo(getX(0), h);

    prices.forEach((price, index) => {

        ctx.lineTo(getX(index), getY(price));

    });

    ctx.lineTo(getX(prices.length - 1), h);

    ctx.closePath();

    ctx.fillStyle = gradient;

    ctx.fill();


    // Price line

    ctx.beginPath();

    prices.forEach((price, index) => {

        if (index === 0) {

            ctx.moveTo(getX(index), getY(price));

        } else {

            ctx.lineTo(getX(index), getY(price));

        }

    });

    ctx.strokeStyle = '#FFFFFF';

    ctx.lineWidth = 2;

    ctx.stroke();


    // Current price

    const lastPrice = prices[prices.length - 1];

    const lastX = getX(prices.length - 1);

    const lastY = getY(lastPrice);


    ctx.beginPath();

    ctx.moveTo(lastX, lastY);

    ctx.lineTo(plotW + 4, lastY);

    ctx.strokeStyle = 'rgba(255,255,255,0.7)';

    ctx.lineWidth = 1.5;

    ctx.stroke();


    // Current point

    ctx.beginPath();

    ctx.arc(lastX, lastY, 4.5, 0, Math.PI * 2);

    ctx.fillStyle = '#FFFFFF';

    ctx.fill();


    // Price label

    ctx.fillStyle = '#FFFFFF';

    ctx.beginPath();

    ctx.roundRect(
        plotW + 4,
        lastY - 11,
        64,
        22,
        6
    );

    ctx.fill();


    ctx.fillStyle = '#080E14';

    ctx.font = 'bold 11px sans-serif';

    ctx.fillText(
        lastPrice.toFixed(2),
        plotW + 10,
        lastY + 4
    );

}


// ==========================================
// MOSCOW TIME
// ==========================================

function getMskTimeWindow(candlesCount) {

    const now = new Date();

    const start = new Date(
        now.getTime() + 3 * 60 * 60 * 1000
    );

    const settings = timeframeSettings[currentTf];

    const end = new Date(
        start.getTime() +
        settings.seconds *
        candlesCount *
        1000
    );


    const format = date => {

        return date.toLocaleTimeString('ru-RU', {

            timeZone: 'UTC',

            hour: '2-digit',

            minute: '2-digit',

            hour12: false

        });

    };


    return `${format(start)} – ${format(end)} (МСК)`;

}


// ==========================================
// TECHNICAL ANALYSIS
// ==========================================

function analyzeMarket() {

    if (prices.length < 20) {

        return null;

    }


    const recent = prices.slice(-20);

    const first = recent[0];

    const last = recent[recent.length - 1];


    if (!Number.isFinite(first) || !Number.isFinite(last)) {

        return null;

    }


    // Price momentum

    const momentum = last - first;


    // Average movement

    let totalMovement = 0;

    for (let i = 1; i < recent.length; i++) {

        totalMovement += Math.abs(
            recent[i] - recent[i - 1]
        );

    }


    const averageMovement =
        totalMovement / (recent.length - 1);


    // Normalize momentum

    const strength = averageMovement > 0
        ? Math.min(
            Math.abs(momentum) / (averageMovement * 10),
            1
        )
        : 0;


    // Direction

    const isRise = momentum >= 0;


    // Heuristic score.
    // This is NOT a statistically validated probability.

    const probability = Math.round(
        50 + strength * 15
    );


    let reason;

    if (strength < 0.25) {

        reason = i18n[currentLang].reasonWeak;

    } else if (isRise) {

        reason = i18n[currentLang].reasonUp;

    } else {

        reason = i18n[currentLang].reasonDown;

    }


    return {

        isRise,

        probability,

        strength,

        reason,

        candles: timeframeSettings[currentTf].candles,

        timeWindow: getMskTimeWindow(
            timeframeSettings[currentTf].candles
        )

    };

}


// ==========================================
// DISPLAY SIGNAL
// ==========================================

function renderSignal(signal) {

    const dirIcon = document.getElementById('dirIcon');

    const dirText = document.getElementById('dirText');

    const probVal = document.getElementById('probVal');


    if (signal.isRise) {

        dirIcon.className = 'direction-icon rise';

        dirIcon.textContent = '↗';

        dirText.textContent = i18n[currentLang].rise;

        probVal.style.color = '#00E676';

    } else {

        dirIcon.className = 'direction-icon fall';

        dirIcon.textContent = '↘';

        dirText.textContent = i18n[currentLang].fall;

        probVal.style.color = '#FF3D57';

    }


    probVal.textContent = `${signal.probability}%`;


    document.getElementById('candlesText').textContent =
        `${signal.candles} ${i18n[currentLang].candles}`;


    document.getElementById('timeWindow').textContent =
        signal.timeWindow;


    document.getElementById('reasonText').textContent =
        signal.reason;


    document.getElementById('reasonText').style.display =
        'block';


    document.getElementById('loaderState').style.display =
        'none';


    document.getElementById('resultState').style.display =
        'flex';

}


// ==========================================
// SIGNAL BUTTON
// ==========================================

const signalBtn = document.getElementById('signalBtn');


signalBtn.addEventListener('click', () => {

    if (isAnalyzing) return;


    if (prices.length < 20) {

        alert(
            currentLang === 'ru'
            ? 'Недостаточно данных. Подождите подключения к Deriv.'
            : 'Not enough data. Wait for Deriv connection.'
        );

        return;

    }


    if (tg?.HapticFeedback) {

        tg.HapticFeedback.impactOccurred('medium');

    }


    isAnalyzing = true;


    signalBtn.disabled = true;

    signalBtn.classList.add('analyzing');

    signalBtn.textContent =
        i18n[currentLang].btnAnalyzing;


    document.getElementById('signalBox')
        .classList.add('visible');


    document.getElementById('loaderState')
        .style.display = 'flex';


    document.getElementById('resultState')
        .style.display = 'none';


    document.getElementById('reasonText')
        .style.display = 'none';


    // Short visual loading animation

    setTimeout(() => {


        const signal = analyzeMarket();


        if (!signal) {

            isAnalyzing = false;

            signalBtn.disabled = false;

            signalBtn.classList.remove('analyzing');

            signalBtn.textContent =
                i18n[currentLang].btnSignal;

            document.getElementById('signalBox')
                .classList.remove('visible');

            return;

        }


        lastSignal = signal;


        renderSignal(signal);


        if (tg?.HapticFeedback) {

            tg.HapticFeedback.notificationOccurred('success');

        }


        isAnalyzing = false;

        signalBtn.disabled = false;

        signalBtn.classList.remove('analyzing');

        signalBtn.textContent =
            i18n[currentLang].btnSignal;


    }, 1200);

});


// ==========================================
// RESIZE
// ==========================================

window.addEventListener('resize', () => {

    drawChart();

});


// ==========================================
// START
// ==========================================

connectDeriv();

</script>
